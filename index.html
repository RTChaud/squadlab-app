<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16171b">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="SquadLab — a personal Football Manager companion.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SquadLab">
  <title>SquadLab</title>
  <link rel="icon" type="image/png" href="icons/logo.png">
  <link rel="apple-touch-icon" href="icons/logo.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a id="back-btn" class="icon-btn" href="#/" aria-label="Back" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>

      <a id="brand" class="brand" href="#/" aria-label="SquadLab home">
        <span class="brand-mark"><img src="icons/logo-mark.png" alt="" width="40" height="40"></span>
        <span class="brand-name">Squad<span>Lab</span></span>
      </a>

      <div id="page-title" class="page-title" hidden>
        <h1 id="page-title-main"></h1>
        <p id="page-title-sub" hidden></p>
      </div>
    </div>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <!-- File picker (FM snapshots and app backups): opens the iOS Files app, incl. iCloud Drive. Read locally only. -->
  <input id="file-input" type="file" accept=".json,application/json,text/plain" hidden>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript><p class="noscript">SquadLab needs JavaScript enabled.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
